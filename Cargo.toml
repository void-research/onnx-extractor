[package]
name = "onnx-extractor"
version = "0.4.5"
edition = "2024"
authors = ["PieInOblivion"]
license = "MIT"
description = "Minimal ONNX model loader for extracting weights, tensors, operations, and graph structure"
repository = "https://github.com/void-research/onnx-extractor"
keywords = ["onnx", "machine-learning", "tensor", "loader", "parser"]
categories = ["parsing", "science"]
readme = "README.md"
exclude = [
	"tests/**",
	".gitignore",
]

[dependencies]
memmap2 = "0.9"
prost = "0.14"

[build-dependencies]
prost-build = "0.14"